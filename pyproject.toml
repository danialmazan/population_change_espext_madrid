[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-demographic-residual"
version = "0.1.0"
description = "Offline cohort-survival pipeline for Madrid padrón analysis"
requires-python = ">=3.11"

[project.scripts]
madrid-demography = "madrid_demography.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

