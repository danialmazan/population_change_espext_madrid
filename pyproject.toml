[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-demographic-residual"
version = "0.2.0"
description = "Offline cohort-survival pipeline for Madrid padrón analysis"
requires-python = ">=3.12"
dependencies = ["shapely>=2.1,<3", "pyproj>=3.7,<4", "PyYAML>=6,<7", "pyarrow>=23,<24"]

[project.optional-dependencies]
audit-gis = ["pyshp==2.3.1"]
audit-plots = ["matplotlib>=3.9,<4"]
audit-history = ["xlrd>=2.0,<3"]
audit-pdf = ["reportlab>=4.4,<5", "PyMuPDF>=1.26,<2"]
test = ["playwright>=1.50,<2"]

[project.scripts]
madrid-demography = "madrid_demography.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
