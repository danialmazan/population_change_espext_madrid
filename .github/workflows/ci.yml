name: Analytical and explorer validation
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-test.lock
      - run: pip install --no-deps -e .
      - run: ruff check src scripts tests --select F
      - run: ruff format --check src scripts tests
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_demo.py
      - run: python scripts/check_budgets.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_browser.py
        env:
          MADRID_BROWSER: playwright
